pages:
  - text_0:
      - "From a $500 spare-bedroom hustle to a $900 million jewelry empire."

  - text_1:
      - "Kendra grew up in flat Midwestern light, Kenosha winters biting through cheap boots."
      - "She escaped into Aunt Joan's closet, fingering sequins, staring at slides of Paris and Milan."
      - "Back home, the air smelled like casseroles and antiseptic as her stepfather fought brain cancer."

  - text_2:
      - "At nineteen, she walked away from college with more fear than plan."
      - "Her father's $20,000 college fund became rent, mannequins, and a sign reading Hat Box."
      - "She tailored soft, beautiful hats for chemo patients who still wanted to feel like themselves."
      - "Every ring of the shop door, every woman easing off her wig, felt like proof that fashion could be kinder than the disease chewing through her family."

  - text_3:
      - "Five years later, the door stopped ringing and the shelves stopped emptying."
      - "She shut The Hat Box with past-due notices taped to the back room wall."
      - "On paper she was a failed founder and college dropout; in private she was just humiliated and tired."

  - text_4:
      - "From the wreckage, she grabbed the smallest thing: the jewelry customers never stopped asking about."
      - "With $500 and a newborn strapped to her chest, she turned a spare bedroom into a factory."
      - "She walked Austin's blistering sidewalks door to door, tea box of samples in one hand and a diaper bag in the other, switching playful accents to disarm boutique owners who'd already decided a blonde Texas mom couldn't be a serious designer."
      - "At the last shop, she sold every sample just to afford the materials for those first orders."

  - text_5:
      - "Soon her stones flashed under runway lights for Oscar de la Renta and Randolph Duke."
      - "Yet she was still a ghost brand, hidden behind department counters and independent boutiques."
      - "When the 2008 crash wiped out stores and sales fell about forty percent, spreadsheets turned blood-red and she made the reckless call to open a flagship anyway."

  - text_6:
      - "Bank after bank told her no, seeing a divorced mom, not a growth story."
      - "Texas Capital finally listened, and a woman banker treated her like a human, not a file."
      - "On South Congress, she opened a jewelry store that felt more like a party than a vault."
      - "She ripped pieces from locked cases, poured champagne, and built the Color Bar so women could design their own necklaces at a touchscreen while their kids sprawled on bright rugs and tried on tiny earrings."
      - "That experiment scaled into a company valued above a billion dollars, generating roughly $500 million a year and expanding past 160 stores with more on the way."

  - text_7:
      - "Now she's back as executive chair, and again interim CEO, steering an Austin-born giant."
      - "Forbes estimates her personal fortune around $900 million, flirting with billionaire status."
      - "She didn’t just win; she rewired what a woman-led, philanthropy-first jewelry brand could be."
      - "With more than 2,000 employees, mostly women, and millions donated through her foundation to schools and cancer causes, her impact now measures in lives changed, not just units sold."

  - text_8:
      - "Her story isn’t glossy inspiration; it’s a blueprint for turning failure into leverage."
      - "The market doesn’t care about your feelings, but it notices who listens obsessively to customers and keeps showing up after every 'no'."
      - "If you’re staring at your own dead idea, her path says this loud and clear: grab the one thing people actually want, stake more on it than feels safe, and start again from that tiny, terrifying foothold."

