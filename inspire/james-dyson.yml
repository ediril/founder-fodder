pages:
  - text_0:
      - "From maxed-out loans and 5,127 failures to a $14.8B inventor with a £6.6B empire."

  - text_1:
      - "Norfolk skies, salt wind, and a lanky kid who ran long distances because pain felt honest."
      - "In cramped sheds that smelled of resin and wet cardboard, he sketched wheels that floated over mud and machines that swallowed dust."
      - "Money was thin; pride thinner; the hum of a dying Hoover told him something was wrong with the way the world worked."

  - text_2:
      - "He tore open a vacuum bag and found the choke point—so he stole an idea from a sawmill cyclone and dared it to fit in a living room."
      - "He mortgaged comfort, lived off a teacher’s paycheck, and traded weekends for prototypes stacked like gravestones."
      - "Five years vanished into 5,127 iterations that screamed, rattled, clogged, or quit."
      - "He kept going because the noise of failure was still quieter than the thought of giving up."

  - text_3:
      - "Manufacturers smirked; bags were a business model, not a flaw."
      - "Hoover listened and passed—then competitors circled."
      - "Debt piled, doubt hissed, and doors clicked shut."

  - text_4:
      - "Then a pink machine—G-Force—lands in Japan, absurdly bright and defiantly bagless, winning prizes while London looks away."
      - "Royalties drip in; stubbornness turns liquid."
      - "He starts his own firm, hires engineers who like blisters, and sues when a rival copies his cyclone."
      - "It’s not polite; it’s war, and he wins."

  - text_5:
      - "DC01 hits Britain in 1993 and the see-through bin becomes a billboard for dirt and proof."
      - "Fans lose their blades, dryers lose their roar, motors spin faster than common sense."
      - "The world starts paying to hear less noise."

  - text_6:
      - "Headquarters shift to Singapore; factories hum; 15,000 people chase airflow and friction while the brand enters haircare, robots, and wearables."
      - "Revenues crest at £7.1B in 2023; then a tough 2024 trims profit even as volumes hit records."
      - "He swings for an electric car, burns hundreds of millions, and kills it before it kills the company."
      - "Critics jeer; he cuts a thousand roles, regroups, and doubles down on batteries, AI, and motors that whisper."
      - "Momentum isn’t smooth—it’s serrated."

  - text_7:
      - "Today he sits on an estimated $14.8B fortune while Dyson posts £6.6B in 2024 revenue and ships tens of millions of machines a year."
      - "Patents stack up; salons hum with Supersonics; homes breathe through purifiers with algorithms inside."
      - "He didn’t just sell vacuums; he rewired how appliances feel."
      - "The proof isn’t the ads—it’s the suction that never fades."

  - text_8:
      - "Build the thing that breaks the spreadsheet."
      - "Accept that the climb includes lawsuits, layoffs, and ideas that die so better ones can live."
      - "Persistence isn’t pretty, but it compounds like interest."

