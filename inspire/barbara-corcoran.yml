pages:
  - text_0:
      - "From the dyslexic 'dumb kid' to a $5 billion real estate empire and $100 million shark."

  - text_1:
      - "In a cramped New Jersey house, ten kids shared hand-me-down beds and secrets."
      - "Heat from the kitchen mixed with the sting of her father’s bitter moods, unstable and loud."
      - "Teachers called Barbara the dumb kid while dyslexia turned every blackboard into static."

  - text_2:
      - "By twenty-three, she’d churned through twenty-two jobs and another humiliating paycheck."
      - "At a dingy diner counter, she decided tips would never buy her freedom."
      - "Her boyfriend slid a $1,000 check across the table and said, start something."
      - "She quit waitressing, grabbed a rotary phone, and began renting tiny Manhattan apartments."

  - text_3:
      - "Seven years later, he announced he was marrying her secretary, not his business partner."
      - "He told her she’d never succeed without him, that she was just a glorified waitress."
      - "In that moment, humiliation hit harder than any bounced rent check."

  - text_4:
      - "She walked out, carved off her piece, and renamed it The Corcoran Group."
      - "Instead of apologizing for being small, she made herself noisy, quotable, impossible to ignore."
      - "She invented The Corcoran Report, turning street rumors into hard numbers journalists couldn’t resist."
      - "Every rejection became fuel, every snub another excuse to plaster her name across Manhattan."

  - text_5:
      - "She worked the phones like a street fighter, chasing every shaky lead to closing."
      - "Agents multiplied, listings stacked up, and her logo started appearing on richer doorbells."
      - "Over twenty-five years, that $1,000 seed grew into a $5 billion brokerage."

  - text_6:
      - "In 2001, she signed the papers and walked away with $66 million in cash."
      - "Most people would retire; she went on TV and picked fights over bad business plans."
      - "Shark Tank turned her into America’s brash real estate aunt, equal parts charm and razor."
      - "She poured roughly $62 million into scrappy founders, knowing ninety percent would probably bomb."
      - "Then one goofy wearable blanket deal turned a $50,000 bet into $468 million."

  - text_7:
      - "Today, her personal net worth hovers around $100 million, not theoretical—money actually banked."
      - "The brokerage she built still dominates New York, a monument to one waitress’s grudge."
      - "Her name moves book sales, speaking fees, TV ratings, and eight-figure penthouse contracts in a day."
      - "She didn’t just escape the small life; she weaponized it and sold shares."

  - text_8:
      - "Barbara’s story isn’t about genius; it’s about refusing to stay who they said you were."
      - "She turned dyslexia, bad grades, and heartbreak into a tracking device for opportunity."
      - "The lesson is brutal and simple: use your disadvantages loudly, or someone richer will."

