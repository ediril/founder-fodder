pages:
  - text_0:
      - "From a two-room Chennai flat to leading a $3.4 trillion empire."

  - text_1:
      - "Heat sticks to the concrete as a moped coughs through Ashok Nagar."
      - "Four people, two rooms, no refrigerator; boys on a living-room floor listening to the water truck rumble down a dry street."
      - "He counts phone numbers like prayer beads and dreams of circuits he’s never seen."

  - text_2:
      - "A single paper ticket—his father’s near year of wages—buys a first flight to California."
      - "The air in San Francisco feels cold and possible; the Stanford labs glow like a new sun."
      - "Everything is expensive; every call home costs dollars he doesn’t have."
      - "So he trades comfort for code and keeps going."

  - text_3:
      - "Years later, under the hottest spotlight, Bard stumbles on day one."
      - "Billions vanish in hours."
      - "The world laughs, and the whispers sharpen: ‘Google lost it.’"

  - text_4:
      - "He’s been here before—when a no-name browser idea looked foolish against Internet Explorer."
      - "Build anyway; ship faster; make speed the product and simplicity the weapon."
      - "After the Bard bruise, he drags the teams into the furnace and hammers cadence: iterate, integrate, own the mistake, outlearn the room."
      - "Defiance isn’t a speech—it’s the next release pushed before dawn."

  - text_5:
      - "Chrome lands quiet, then roars; tabs multiply like city lights at night."
      - "Android spreads across continents, cheap enough to matter, powerful enough to stay."
      - "Manufacturers sign, developers follow, and the web bends toward his bets."

  - text_6:
      - "2015: he takes the wheel at Google; the dashboard reads billions and rising."
      - "Alphabet clears $350 billion in annual revenue by 2024 and cracks a $100+ billion quarter in 2025."
      - "Android passes 3.5 billion users; Chrome owns the browser streets."
      - "Investors blink and the valuation leaps past $3 trillion, then climbs higher."
      - "Momentum stops being a story and becomes the operating system."

  - text_7:
      - "Today, he runs a company worth roughly $3.4 trillion with about 190,000 employees and $350 billion in yearly sales."
      - "Chrome commands ~70%+ of global browsing; Android rides in billions of pockets."
      - "His personal stake: a net worth around $1.4 billion."
      - "He didn’t just win. He reset default."

  - text_8:
      - "Scrappy doesn’t disappear when you get resources; it just changes form."
      - "Build through the heckling, learn in public, and make speed your apology."
      - "Greatness is less thunderclap than drumbeat."

