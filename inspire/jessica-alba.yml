pages:
  - text_0:
      - "From a sick kid in hospital corridors to a $2.1 billion brand launch."

  - text_1:
      - "The hospital room hummed with machines while desert wind scratched California windows."
      - "Jessica lay small in the bed, IV taped to bruised skin."
      - "Her mother slept on a metal cot again, counting breaths between asthma attacks."

  - text_2:
      - "At five, she decided superheroes were real and she would play them."
      - "By eleven, still shy and sick, she begged for one wild detour."
      - "Her mom drove to a Beverly Hills acting contest, gas tank nearly empty."
      - "Jessica walked into a room of perfect, confident kids and thought, If I can be anyone but me, maybe I finally breathe."

  - text_3:
      - "Years later on a blockbuster set, a director watched her cry and winced."
      - "He told her to cry pretty, flatten the pain for the camera."
      - "Driving home that night, she wondered if Hollywood wanted a doll, not her."

  - text_4:
      - "When pregnancy brought a rash from baby detergent, fear flooded back like childhood fevers."
      - "Instead of switching brands quietly, she started reading chemical labels like scripts."
      - "Everyone told her celebrity brands were vanity projects, not real companies with audits and recalls."
      - "She raised venture money, hired chemists, argued over diaper materials, and slapped the word Honest on every bottle as both promise and dare."

  - text_5:
      - "The first lineup was just 17 baby and home products shipping from a scrappy digital storefront."
      - "Orders stacked up, customer photos of clean nurseries replacing tabloid red carpets."
      - "Sales hit $50 million, then a near $1 billion valuation as investors chased safe diapers."

  - text_6:
      - "Honest expanded into makeup, cleaners, European shelves, and big-box aisles across America."
      - "In 2021, the IPO raised over $400 million and briefly priced the company above $2 billion."
      - "Her stake crossed nine figures on paper, headlines crowning her a $340 million mogul."
      - "Even when lawsuits hit, valuations dipped, and every mislabeled sunscreen bottle became a weapon online, she kept showing up to boardrooms instead of movie sets."

  - text_7:
      - "Today Honest posts roughly three hundred plus million in annual sales worldwide."
      - "The company once hit a $2.1 billion market cap, now steadier around hundreds of millions."
      - "In 2016, Forbes pegged her net worth at roughly $340 million."
      - "She didn’t just pivot careers; she rewrote what a Hollywood exit looks like."

  - text_8:
      - "Her story isn’t clean, or linear, or free of PR disasters."
      - "It’s a sick kid who hated her own skin building a company around protecting others’."
      - "You don’t need a perfect past, just the nerve to turn your worst pain into a product that might actually help someone."

