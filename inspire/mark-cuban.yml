pages:
  - text_0:
      - "From door-to-door garbage bags to a $5.7 billion dot-com cash-out. :contentReference[oaicite:0]{index=0}"

  - text_1:
      - "Summer in Pittsburgh felt heavy, humid, and broke."
      - "At twelve, Mark hauled garbage-bag boxes down cracked sidewalks, rehearsing his pitch. :contentReference[oaicite:1]{index=1}"
      - "Each knock carried his pitch into cramped living rooms that smelled like coffee and cigarettes."

  - text_2:
      - "In college at Indiana, the world widened to cheap beer, bruised ribs, and Motleys bar. :contentReference[oaicite:2]{index=2}"
      - "He bought it at twenty-one, betting student chaos could cover the rent."
      - "When the bar got nailed for underage drinkers, the dream collapsed overnight."
      - "He told himself walking off that sticky floor: next time, the rules would be his."

  - text_3:
      - "In Dallas he was a fired salesman with sixty bucks and rent due."
      - "He walked back to the store holding a fifteen-thousand-dollar check and still got canned. :contentReference[oaicite:3]{index=3}"
      - "Walking home, his boss's crack about his cheap suit burned louder than the Texas sun."

  - text_4:
      - "The next morning, broke and furious, he opened a legal pad and wrote MicroSolutions."
      - "He called every old customer he knew, promising their systems would never go dark."
      - "He slept on a nasty floor with roommates, skipped vacations, lived on takeout and manuals. :contentReference[oaicite:4]{index=4}"
      - "Code, coffee, and stubbornness turned that tiny consulting hustle into real payroll and serious revenue."

  - text_5:
      - "By thirty-two, he sold MicroSolutions for six million dollars and finally had breathing room. :contentReference[oaicite:5]{index=5}"
      - "He joked about retiring, but boredom hit faster than the money cleared."
      - "Dial-up static pulled him back, an idea forming around streaming hometown games online. :contentReference[oaicite:6]{index=6}"

  - text_6:
      - "Audionet became Broadcast.com, wiring sports, radio, and corporate events online before most people cared. :contentReference[oaicite:7]{index=7}"
      - "The IPO popped, shares rocketing on day one while servers groaned under new traffic. :contentReference[oaicite:8]{index=8}"
      - "Yahoo offered stock worth about five point seven billion, so he hedged every share hard. :contentReference[oaicite:9]{index=9}"
      - "When dot-com darlings crashed, that collar trade kept him a billionaire instead of another punchline. :contentReference[oaicite:10]{index=10}"
      - "With that war chest he bought the Mavericks, upgraded everything, then stormed onto Shark Tank. :contentReference[oaicite:11]{index=11}"

  - text_7:
      - "Today his net worth hovers near six billion dollars, bouncing with markets and exits. :contentReference[oaicite:12]{index=12}"
      - "He turned a six-million-dollar consulting win into a multi-billion-dollar exit and a three-point-five-billion-dollar franchise sale. :contentReference[oaicite:13]{index=13}"
      - "His bets now sprawl across startups, media, consumer brands, and a drug company cutting prices. :contentReference[oaicite:14]{index=14}"
      - "He did not just get rich; he changed how loud builders can be in public."

  - text_8:
      - "His story says you can start with trash bags, floor mattresses, and still swing big."
      - "The price was brutal focus, years without balance, and risk that could have ruined him."
      - "The playbook is ugly but clear, learn hard, eat hits, then keep betting bigger."

