pages:
  - text_0:
      - "From a sick, broke Carolina kid to a $5,000,000,000 attention machine."

  - text_1:
      - "Greenville, North Carolina, smelled like cut grass and school cafeterias, not destiny."
      - "In a cramped bedroom, a skinny kid with Crohn’s hunched over a flickering monitor, headphones clamped, frame rate stuttering."
      - "While classmates dreamed about scholarships and steady jobs, Jimmy obsessed over one thing: why some YouTube videos exploded and his didn’t."

  - text_2:
      - "College lasted weeks; the pull of a fluorescent classroom lost to the glow of YouTube analytics at 3 a.m."
      - "He dropped out with no safety net, just a cheap PC, bad internet, and a brain looping watch-time graphs."
      - "He filled notebooks and spreadsheets with title tests, thumbnail tweaks, and insane ideas that sounded stupid out loud."
      - "Every cent of early AdSense went back into the channel, not into comfort, because the bet was simple and terrifying: either this works, or there is nothing."

  - text_3:
      - "Views crawled, then stalled, and the algorithm felt like a brick wall with no door."
      - "Family worried, friends joked that he was wasting his life yelling into a camera for strangers."
      - "Meanwhile his body betrayed him with Crohn’s flares, hospital smells mixing with the metallic taste of failure."

  - text_4:
      - "So he decided to do something so stupidly committed that the internet couldn’t look away: sit there and count to 100,000, on camera, for more than forty hours straight."
      - "Eyes red, voice cracking, numbers blurring, he kept going while the room grew smaller and the world on the other side of the screen finally leaned in."
      - "That video hit, and his brain lit up – this was the formula: painful endurance, ridiculous stakes, crystal-clear thumbnails, and hooks that grabbed you in one second or less."
      - "From there the defiance escalated into burying himself alive, giving away cars he couldn’t really afford, and treating generosity like a weapon pointed at the algorithm."

  - text_5:
      - "The kid in the dark bedroom turned into a crew: childhood friends upgrading from minimum wage jobs to full-time chaos engineers."
      - "Budgets climbed from hundreds to thousands to millions per upload, every video a bigger risk that sometimes ended with him nearly broke again, smiling tight because he’d bet it all on the next idea."
      - "Challenges, giveaways, and charity stunts rewired viewer expectations, and suddenly tens of millions of people were watching strangers win houses, island challenges, and second chances."

  - text_6:
      - "Then he stopped thinking like a YouTuber and started thinking like a studio and a conglomerate smashed together: Beast Industries, Feastables chocolate bars, ghost kitchens slinging MrBeast Burgers, Amazon game shows, mobile networks, even financial services wearing his grin."
      - "His empire pulled in hundreds of millions in annual revenue, yet he kept pouring money back into bigger sets, higher stakes, and crews that swarmed like film armies."
      - "Feastables alone raced to nine-figure brand territory, chocolate bars moving by the millions while TikToks and billboards blurred into one giant funnel."
      - "On YouTube, the main channel blew past 450 million subscribers and over 100 billion views, every upload dropping like a cultural event rather than just another video."

  - text_7:
      - "Today, Beast Industries has reportedly been valued around $5 billion, built on raw attention and relentless reinvestment."
      - "Jimmy’s personal net worth is estimated in the billions, depending on who’s guessing and how they count."
      - "His channels reach hundreds of millions of people, and his charity projects have funneled tens of millions of dollars into trees, oceans, food, and medical help."
      - "He didn’t just get rich making videos; he turned the algorithm into an assembly line for impact, controversy, and jaw-dropping scale."

  - text_8:
      - "The real story isn’t that he got lucky; it’s that he stayed obsessed when it looked pathetic."
      - "He turned illness, boredom, and ridicule into leverage by studying his craft harder than anyone else cared to."
      - "If there’s a lesson here, it’s this: pick your game, go unreasonably deep, and keep doubling down long after everyone else has decided you’ve already gone too far."

