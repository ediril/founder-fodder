pages:
  - text_0:
      - "From exiled cofounder to the youngest woman to take a company public—and a $1.07B-a-year platform."

  - text_1:
      - "Salt Lake air thin and crisp; a mixed-faith home where holidays doubled and opinions clashed."
      - "On a Dallas campus, she hawks bamboo totes to clean an oil-slicked Gulf, learning the smell of hot plastic and hustle."
      - "She isn’t special yet, just loud, observant, and dangerously good at making a name stick."

  - text_2:
      - "Swipe culture explodes; she jumps in, branding, naming, coaxing sparks into a bonfire."
      - "Then the floor gives way—lawsuit, headlines, messages you can’t unread."
      - "She walks out with a scar and an idea: flip the script so women speak first."
      - "Call it defiance, call it design; she bets her future on it."

  - text_3:
      - "They said it wouldn’t scale."
      - "They said men wouldn’t wait."
      - "They said she was finished."

  - text_4:
      - "She builds the hive anyway—yellow, friendly, rules pinned like guardrails."
      - "Safety as a feature, brand as a feeling, product as a boundary."
      - "She partners up, ships fast, and wraps courage in a UI where the first move belongs to her users."
      - "It’s part app, part manifesto."

  - text_5:
      - "Push notifications become little drums; cities light up with matches and Monday-morning debriefs."
      - "BFF and Bizz widen the lanes—friendship, work, life stitched inside the same swipe."
      - "Momentum hums; the naysayers get quieter."

  - text_6:
      - "February 2021: she rings the bell at 31, the youngest woman to do it, a baby on her hip and a billion-dollar valuation roaring back through the speakers."
      - "Shares pop; for a moment she’s a self-made billionaire, proof that a boundary can be a brand."
      - "Then the market turns cruel—downloads ebb, competition claws back, a CEO shuffle, layoffs, hard calls."
      - "The company still throws off real numbers: $1.07 billion in 2024 revenue, millions paying for the experience, the model bending but not breaking."
      - "She returns to the cockpit, dust in her lungs and a map full of edits."

  - text_7:
      - "Today the empire is leaner, tougher, and still loud enough to matter."
      - "Revenue clears a billion; paying users count in the millions; she’s back in the CEO chair to rewire the engine."
      - "Her personal net worth rides the waves—off the billionaire peak, but very much in the arena."
      - "She didn’t just launch an app; she changed who speaks first."

  - text_8:
      - "Power isn’t the loudest pitch; it’s the product rule you refuse to compromise."
      - "When the crowd laughs, ship anyway—and measure in users, not opinions."
      - "Build the thing that protects the person you used to be."

