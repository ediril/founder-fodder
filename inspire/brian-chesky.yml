pages:
  - text_0:
      - "From $20,000 credit-card debt to a ~$83B Airbnb—and a ~$9.2B founder stake."

  - text_1:
      - "Niskayuna felt quiet—suburbs, winter air, and a kid sketching escapes."
      - "His parents were social workers; money was practical, not abundant."
      - "Brian learned to redesign toys like problems begged to be redrawn."

  - text_2:
      - "He chose art over the safer ladder, heading to RISD for industrial design."
      - "In San Francisco years later, rent came due like a weekly threat."
      - "A conference was in town, hotels were full, and their bank account wasn’t."
      - "So they inflated air mattresses, sold floor space, and called it a company."

  - text_3:
      - "Investors stared, then laughed: strangers won’t sleep in strangers’ homes."
      - "Seven meetings, seven nos, two ghosts—$150k for 10% evaporated."
      - "The idea sounded wrong, which meant it might be valuable."

  - text_4:
      - "They made cereal boxes—Obama O’s and Cap’n McCain’s—like a dare."
      - "Hot glue, burned fingers, numbered “limited editions,” and $40 a box."
      - "Contrarian belief: trust isn’t marketing; trust is product design."
      - "They didn’t beg for belief—they shipped a story loud enough to get seen."

  - text_5:
      - "Y Combinator still mocked the concept, but respected the refusal to die."
      - "Then they did the unscalable thing: fly to New York, shoot listing photos."
      - "Revenue stopped flatlining, because the product finally looked believable."

  - text_6:
      - "The climb wasn’t “growth”; it was converting fear into a repeatable flow."
      - "Design choices became systems: identity, reviews, photos, payments, support."
      - "They stretched from rooms to homes, then to a global travel reflex."
      - "By 2024, Airbnb reported $11.1B revenue and $2.6B net income."

  - text_7:
      - "Chesky’s estimated net worth sits around $9.2B."
      - "Airbnb’s market cap is about $83B in late 2025."
      - "Airbnb said it had about 7,300 employees at 2024 year-end."
      - "He didn’t rent rooms—he industrialized trust."

  - text_8:
      - "This story proves that “impossible” markets are often just undesigned markets."
      - "The lesson here isn’t charisma or timing; it’s building belief into the interface."
      - "If users feel safe, conversion becomes a consequence, not a campaign."

