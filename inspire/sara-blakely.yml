pages:
  - text_0:
      - "From a $5,000 gamble and a pair of scissors to a $1.2B shapewear empire."

  - text_1:
      - "Orlando heat pressed through nylons as she knocked doors selling fax machines, the kind of job that teaches you how many ways a person can say no."
      - "She’d once dreamed of law school but bombed the LSAT, did a stint at Disney, and tried stand-up in rooms that smelled like beer and nerves."
      - "In her apartment’s yellow light, she stared at white pants, scissors in hand, and cut—because nothing else in her life was cutting it."

  - text_2:
      - "She set aside $5,000 and a tolerance for humiliation, then drove to North Carolina to beg male-run mills for a shot."
      - "They didn’t get it; she kept pitching anyway, nights spent learning patents and packaging like a foreign language."
      - "One owner called back after his daughters weighed in—finally, a door open a sliver."
      - "She wedged her foot in."

  - text_3:
      - "Hosiery mills laughed; buyers brushed her off."
      - "The room went cold more than once, the kind of silence that eats you alive."
      - "She kept dialing."

  - text_4:
      - "In Dallas, feeling the meeting die, she dragged the Neiman Marcus buyer to the ladies’ room and did a two-minute costume change—before and after, same pants, different body."
      - "No slides, no jargon, just proof in a mirror."
      - "The order landed, and for a beat she let herself breathe."
      - "Then she boxed product in her apartment and shipped like her life depended on it, because it did."

  - text_5:
      - "Oprah put Spanx on ‘Favorite Things’ and the phones screamed; a homemade brand became a need, not a novelty."
      - "QVC segments turned minutes into inventory disappearing acts."
      - "Rejection calls were replaced by purchase orders, which felt stranger than applause."

  - text_6:
      - "Revenue surged into the hundreds of millions, and Spanx became the Kleenex of shapewear."
      - "She hired, scaled, expanded from hosiery to apparel and denim, then made the pivot from product to platform."
      - "Blackstone’s majority deal stamped the company at a $1.2 billion valuation."
      - "At the celebration she handed employees two first-class tickets and $10,000 each—a founder’s exhale weaponized as gratitude."
      - "The little apartment factory had become an Atlanta machine."

  - text_7:
      - "Today she’s consistently listed by Forbes with an estimated net worth around $1.2B, and the brand she cut into existence is still a category king."
      - "Spanx sells in dozens of countries, with a decades-long cultural chokehold on red carpets and office hallways alike."
      - "It wasn’t just a product; it rewired how retail buyers listen when the mirror does the talking."
      - "She didn’t just win. She changed what ‘founder’ looks like."

  - text_8:
      - "Make the leap before the room believes you; drag them to the mirror if you have to."
      - "Build proof they can feel, not theories they can debate."
      - "When the world says no, narrow the ask, sharpen the demo, and keep going until the metric says yes."

