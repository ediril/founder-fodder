pages:
  - text_0:
      - "From a scrappy $85K loan to a $1B fortune."

  - text_1:
      - "Steve Ells trained at University of Colorado and the CIA."
      - "He cooked at Stars in San Francisco after culinary school."
      - "He wanted to open a white-tablecloth restaurant but lacked funds."

  - text_2:
      - "In 1993 he borrowed $85,000 from family to start Chipotle."
      - "He opened a tiny Denver burrito shop near the university."

  - text_3:
      - "The first shop hit strong sales almost immediately."
      - "Within weeks it sold over one thousand burritos daily."
      - "McDonald's invested in 1998 to fuel fast expansion."
      - "By 2006 Chipotle went public and exploded nationwide."

  - text_4:
      - "Ells pledged 'Food With Integrity' sourcing and quality."
      - "He emphasized naturally raised meats and sustainable agriculture."
      - "The brand became synonymous with responsible fast casual dining."

  - text_5:
      - "In 2015 outbreaks of E. coli and norovirus erupted."
      - "Sales plunged and public trust eroded across 2015 and 2016."

  - text_6:
      - "Investor pressure mounted and leadership responsibility shifted."
      - "Ells stepped down as CEO in November 2017."
      - "Brian Niccol became CEO in February 2018 and modernized operations."
      - "He drove digital sales, Chipotlanes, and a culture reset."

  - text_7:
      - "Ells left Chipotle's board and chairman role in March 2020."
      - "He retained equity and quietly built new food ventures afterward."
      - "He later explored automated vegetarian concept Kernal and robotics."

  - text_8:
      - "The arc ran from scrappy hustle to crisis, then comeback."
      - "Ells's choices kept the brand alive through reinvention."

  - text_9:
      - "Today Chipotle operates thousands of restaurants worldwide."
      - "In 2024 Chipotle reported $11.3 billion in total revenue."
      - "Year-end 2024 restaurant count reached 3,726 locations."
      - "Steve Ells's net worth was estimated at $1 billion."

  - text_10:
      - "Small bets can scale into industry-reshaping empires."
      - "Failure and transparency forced reinvention under brutal public scrutiny."
      - "Ells shows that stubborn vision plus adaptation wins."

